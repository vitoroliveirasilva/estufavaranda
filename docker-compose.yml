x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-production}
  FLASK_DEBUG: "0"
  PYTHONUNBUFFERED: "1"
  UPLOAD_BASE_PATH: /data/uploads
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-estufa_da_varanda}}

services:
  postgres:
    image: postgres:16-alpine
    container_name: estufa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-estufa_da_varanda}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-estufa_da_varanda}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: estufa-api
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      <<: *app-environment
      RUN_DB_MIGRATIONS: ${RUN_DB_MIGRATIONS:-true}
      WAIT_FOR_DB: ${WAIT_FOR_DB:-true}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/data/uploads
    command: ["gunicorn", "--config", "gunicorn.conf.py", "wsgi:application"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()\" || exit 1",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  worker:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: estufa-worker
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      <<: *app-environment
      RUN_DB_MIGRATIONS: "false"
      WAIT_FOR_DB: ${WAIT_FOR_DB:-true}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/data/uploads
    command: ["python", "-m", "app.workers.scheduler"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  nginx:
    image: nginx:1.27-alpine
    container_name: estufa-nginx
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-10m}
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  uploads_data:
