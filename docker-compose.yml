version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: estufa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-estufa_da_varanda}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-estufa_da_varanda}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: estufa-api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - uploads_data:${UPLOAD_BASE_PATH:-/data/uploads}
      - app_logs:/var/log/estufa
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/app/docker/api/entrypoint.sh", "gunicorn", "--config", "gunicorn.conf.py", "wsgi:app"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/api/v1/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: estufa-worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - uploads_data:${UPLOAD_BASE_PATH:-/data/uploads}
      - app_logs:/var/log/estufa
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/app/docker/api/entrypoint.sh", "python", "-m", "app.workers.scheduler"]

  nginx:
    image: nginx:1.27-alpine
    container_name: estufa-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-localhost}
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:${UPLOAD_BASE_PATH:-/data/uploads}:ro

volumes:
  postgres_data:
  uploads_data:
  app_logs:
